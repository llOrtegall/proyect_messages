version: '3.8'

services:

  web_chat:
    image: nginx:latest
    container_name: web_chat
    restart: always
    volumes:
      - ./client/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api_chat
    networks:
      - internal_net

  api_chat:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: api_chat:v1
    container_name: api_chat_container
    restart: always
    networks:
      - internal_net

networks:
  internal_net:
    external: true