version: '3.8'

services:

  web_chat:
    image: nginx:latest
    container_name: web_chat
    restart: always
    # ports:
    #   - "9011:80"
    volumes:
      - ./client/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api_chat
    networks:
      - internal_net

  database_chat:
    image: mysql:latest
    container_name: database_chat
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # ports:
    #   - "9010:3306"
    volumes:
      - ./database_chat_data:/var/lib/mysql
    networks:
      - internal_net

  api_chat:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: api_chat:v1
    container_name: api_chat_container
    restart: always
    # ports:
    #   - "3000:3000"
    depends_on:
      - database_chat
    networks:
      - internal_net

networks:
  internal_net:
    external: true
    name: internal_net